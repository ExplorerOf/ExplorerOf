name: terminal

on:
  push:
    paths: ["terminal.pt.json", "terminal.en.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ExplorerOf/readme-terminal@v1
        with:
          config: terminal.pt.json
          output: terminal.svg
      - uses: ExplorerOf/readme-terminal@v1
        with:
          config: terminal.en.json
          output: terminal.en.svg
      - name: Commit the SVGs if they changed
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add terminal.svg terminal.en.svg
          git diff --cached --quiet || (git commit -m "Atualiza o terminal" && git push)
